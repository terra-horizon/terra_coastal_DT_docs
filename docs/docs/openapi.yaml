openapi: 3.0.3
info:
  title: TERRA UGLA API
  version: "0.1.0"
paths:
  /healthz:
    get:
      summary: Health check
      responses:
        "200":
          description: Service is healthy
  /check_sentinel_hub_status:
    get:
      summary: Check Sentinel Hub availability
      responses:
        "200":
          description: Sentinel Hub status
  /aoi:
    get:
      summary: List AOIs
      responses:
        "200":
          description: AOI list
  /aoi/{aoi_id}/timeseries/status:
    get:
      summary: Fixed-geometry timeseries readiness for one AOI
      parameters:
        - in: path
          name: aoi_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: AOI timeseries status
  /aoi/{aoi_id}/forecast/latest:
    post:
      summary: Forecast latest VE state from the newest AOI transect series
      parameters:
        - in: path
          name: aoi_id
          required: true
          schema:
            type: string
      requestBody:
        required: false
      responses:
        "200":
          description: Forecast metadata and artifact paths. `yearly` returns statistical p10/p50/p90 quantile forecasts; `semiannual` may return either learned output or baseline fallback.
  /dt/bootstrap:
    get:
      summary: Bootstrap digital twin state
      responses:
        "200":
          description: Bootstrap payload
  /dt/predict:
    post:
      summary: Predict future VE state
      requestBody:
        required: true
      responses:
        "200":
          description: Prediction payload with `primary_forecast_geojson` (`p50`) and uncertainty lines (`p10/p50/p90`).
