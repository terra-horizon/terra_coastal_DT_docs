site_name: TERRA Coastal DT
site_description: Coastal digital twin for vegetation-edge monitoring and MambaLSTM-based forecasting on Scottish dune coasts.

site_url: https://terra-horizon.github.io/terra_coastal_DT_docs/
repo_url: https://github.com/terra-horizon/terra_coastal_DT_docs/
repo_name: terra_coastal_DT_docs

nav:
  - Overview: index.md
  - AI Model:
    - MambaLSTM Forecasting Model: ai-model/mambalstm.md
    - Training & Evaluation: ai-model/training-evaluation.md
    - Model Lifecycle: ai-model/model-lifecycle.md
  - Components:
    - AI-enabled Satellite Image Processing: components/satellite-image-processing.md
    - Coastal Vegetation Edge Indicator Extraction: components/vegetation-edge-extraction.md
    - Coastal Change Time-Series Analysis and Forecasting: components/time-series-forecasting.md
    - Intelligent Coastal Digital Twin Orchestration: components/digital-twin-orchestration.md
  - System:
    - Architecture: architecture.md
    - Data & State Model: data-state.md
    - Data Ingestion: data-ingestion.md
    - API Surface: api.md
  - Workflows:
    - Forecast Workflow: forecast-workflow.md
    - Retrospective Validation: validation.md
    - Technical Approach: technical-route.md
  - Setup & Operations:
    - Deployment: deployment.md
    - Configuration: configuration.md
    - Maintenance: maintenance.md
  - Material:
    - Quality Assurance: qa.md
    - FAQ & Known Issues: faq.md
  - License: license.md
  - Home: https://terra-horizon.github.io/

theme:
  name: 'material'
  favicon: images/favicon.ico
  logo: images/TERRA_Logo_Header.png
  icon:
    repo: fontawesome/brands/github
  custom_dir: overrides
  features:
    - navigation.path
    - navigation.top
    - content.code.copy

extra_css:
  - stylesheets/custom-footer.css
  - stylesheets/mkdocsoad.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

plugins:
  - search
  - mike
  - neoteroi.mkdocsoad:
      use_pymdownx: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra:
  version:
    provider: mike
    alias: true
    default: latest
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/terra-horizon
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/horizon_terra
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/@TERRAHORIZON
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/terra-horizon
